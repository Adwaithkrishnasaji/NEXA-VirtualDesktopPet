<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Bolt the sky-blue robot">
  <style>
    .antenna { animation: pulse 1.2s ease-in-out infinite; transform-origin: 120px 43px; }
    .head { animation: turn 3.2s ease-in-out infinite; transform-origin: 120px 148px; }
